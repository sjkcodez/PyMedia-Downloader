{% extends "base.html" %}
{% block title %}Settings — PyMedia Downloader{% endblock %}

{% block content %}
<section class="hero">
  <h1>Settings</h1>
  <p>Preferences applied to new downloads.</p>
</section>

<div class="card">
  <h2 class="section-heading">Defaults</h2>

  <div class="options-grid">
    <div class="field">
      <label class="field-label">Video quality</label>
      <select id="set-video-quality" class="input">
        <option value="360p">360p</option>
        <option value="480p">480p</option>
        <option value="720p">720p</option>
        <option value="1080p">1080p</option>
        <option value="2k">2K</option>
        <option value="4k">4K</option>
        <option value="best">Best available</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Audio bitrate</label>
      <select id="set-audio-bitrate" class="input">
        <option value="128">128 kbps</option>
        <option value="192">192 kbps</option>
        <option value="320">320 kbps</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Video format</label>
      <select id="set-video-format" class="input">
        <option value="mp4">MP4</option>
        <option value="webm">WebM</option>
        <option value="mkv">MKV</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label">Audio format</label>
      <select id="set-audio-format" class="input">
        <option value="mp3">MP3</option>
        <option value="m4a">M4A</option>
        <option value="wav">WAV</option>
        <option value="flac">FLAC</option>
      </select>
    </div>
  </div>

  <button class="btn btn-amber btn-block" id="save-settings-btn" type="button">
    Save preferences
  </button>
</div>
{% endblock %}

{% block scripts %}
<script>
(async function () {
  const $ = id => document.getElementById(id);

  const cfg = await (await fetch("/api/config")).json();

  const map = {
    "set-video-quality":   "default_video_quality",
    "set-audio-bitrate":   "default_audio_bitrate",
    "set-video-format":    "default_video_format",
    "set-audio-format":    "default_audio_format",
  };
  for (const [id, key] of Object.entries(map)) {
    if (cfg[key] != null) $(id).value = cfg[key];
  }

  $("save-settings-btn").addEventListener("click", async () => {
    const payload = {};
    for (const [id, key] of Object.entries(map)) {
      payload[key] = $(id).value;
    }
    const res = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.ok) {
      alert("Preferences saved.");
    } else {
      alert("Failed to save preferences.");
    }
  });
})();
</script>
{% endblock %}
